# cargo-deny policy used by the quality audit (tools/quality_audit/run.py). The repository
# has no deny.toml of its own; this one is informational and mirrors the licence allowlist
# in tools/third_party.py (PERMISSIVE), so the two agree about what "permissive" means.
#
#   cargo deny --all-features check --config tools/quality_audit/deny.toml

[graph]
all-features = true

[advisories]
# RustSec. `unmaintained` notices are reported for workspace crates' whole dependency tree.
unmaintained = "workspace"
yanked = "warn"

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT", "MIT-0", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "0BSD",
    "Unicode-3.0", "Unicode-DFS-2016", "Unlicense", "CC0-1.0", "BSL-1.0",
    "Apache-2.0 WITH LLVM-exception", "CDLA-Permissive-2.0",
]

[bans]
# Duplicate versions are reported, not failed: most come from the ML runtimes behind
# optional features, and the census is the point.
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
