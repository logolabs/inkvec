name: studio

# Inkvec Studio's own CI. It is separate from `ci.yml` because the app needs a
# webview toolchain that the engine deliberately does not: `cargo build --workspace`
# must keep working on a machine with no WebKitGTK, which is why `studio/src-tauri` is
# excluded from the root workspace.
#
# Path-filtered, so a change to the tracer does not spend fifteen minutes building three
# desktop apps -- with one exception below, because a change to the engine *can* break
# the app it is compiled into.

on:
  push:
    branches: [main, master]
    paths:
      - "studio/**"
      - "crates/**"
      - "docs/studio/**"
      - "tools/build_site.py"
      - ".github/workflows/studio.yml"
  pull_request:
    paths:
      - "studio/**"
      - "crates/**"
      - "docs/studio/**"
      - "tools/build_site.py"
      - ".github/workflows/studio.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The fast half: types, lint, the backend's own tests, and the assets. Runs on Linux
  # only because none of it is platform-dependent, and it fails long before the slow
  # matrix would.
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio/src-tauri

      - name: Install the webview toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev librsvg2-dev patchelf

      - run: npm ci
        working-directory: studio

      - name: Frontend types and bundle
        working-directory: studio
        run: npm run build

      # The app declares the `inkvec` command as an external binary, so it has to exist
      # before any cargo command in `src-tauri` — the build script checks for it.
      - name: Build the bundled inkvec command
        working-directory: studio
        run: npm run sidecar

      # The desktop shell, the shared core (studio/core) and the browser shell
      # (studio/wasm) are one workspace; all three are tested.
      - name: Backend tests
        working-directory: studio/src-tauri
        run: cargo test --release --workspace

      # Inkvec Studio Lite: the browser shell must still compile for the browser.
      - name: Browser build compiles
        working-directory: studio/src-tauri
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p inkvec-studio-wasm --target wasm32-unknown-unknown

      - name: fmt
        working-directory: studio/src-tauri
        run: cargo fmt --all -- --check

      # The same gate the engine holds itself to: correctness and suspicious fail the
      # job, plain warnings do not.
      - name: clippy
        working-directory: studio/src-tauri
        run: cargo clippy --workspace --all-targets -- -D clippy::correctness -D clippy::suspicious

      # The icon, the installer bitmaps and the bundled samples are generated from
      # `studio/tools/make_assets.py`. This fails if the committed binaries have drifted
      # from the script that draws them, which is the only way to keep a binary in a
      # repository honest.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pillow is pinned to the version the assets are drawn with (PILLOW in
      # make_assets.py): it bundles FreeType, whose hinting of the installer text changes
      # between releases. Images are compared by decoded pixels, so zlib differences in
      # the PNG bytes do not count. Markdown and Pygments are pinned for the same reason:
      # the guide below is compared byte for byte, and a newer release renders code blocks
      # differently (markdown 3.11 / pygments 2.21 changed tutorials/favicon-asset-pack.html).
      # Keep these in step with the versions the committed guide was built with.
      - run: pip install pillow==12.3.0 markdown==3.5.1 pygments==2.19.1
      - run: python studio/tools/make_assets.py --check

      # The user guide the app opens from Help is a build of docs/studio/, committed so the
      # app needs no Python to build. This fails if it has drifted from those pages.
      - run: python tools/build_site.py --studio-guide --check

      # The app ships its own notices and shows them on About. This fails if they have
      # drifted from the dependency graph they claim to describe.
      - run: python studio/tools/third_party.py --check

  # The slow half: does the app actually build and package on each platform?
  #
  # The images, the feature flags and the bundle formats are the release workflow's,
  # deliberately. When they were not, a tagged build was the first thing to ever run each
  # of those combinations, and each one failed there in turn: `--features denoiser` would
  # not link on the image the release used, and then `bundle.category` -- a single wrong
  # word in tauri.conf.json -- failed every bundler on every platform after compiling the
  # whole app, so 0.1.5 published no installers at all. `--no-bundle` here is what let
  # that through: packaging was the only step no CI run ever executed. It costs a few
  # minutes per platform to stop doing that.
  #
  # A matrix that tests a different combination from the one you ship tells you nothing
  # about the one you ship.
  build:
    name: build (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            denoiser: true
            bundles: deb,rpm,appimage
          - os: macos-14 # arm64
            denoiser: true
            bundles: app,dmg
          - os: windows-latest
            denoiser: true
            bundles: nsis,msi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - uses: dtolnay/rust-toolchain@1.98.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio/src-tauri
          key: ${{ matrix.os }}

      - name: Install the webview toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev librsvg2-dev patchelf file desktop-file-utils xdg-utils

      # linuxdeploy's AppImage plugin downloads the type2 runtime in the middle of
      # bundling, and a 504 from that download failed a Linux row once already. A tag run
      # that dies there costs a re-tag, so fetch it up front with retries and hand the
      # plugin the file through LDAI_RUNTIME_FILE.
      - name: Fetch the AppImage runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          runtime="${RUNNER_TEMP}/appimage-runtime-$(uname -m)"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
            -o "${runtime}" \
            "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-$(uname -m)"
          chmod +x "${runtime}"
          echo "LDAI_RUNTIME_FILE=${runtime}" >> "${GITHUB_ENV}"

      - run: npm ci
        working-directory: studio

      - name: Build and package the app
        working-directory: studio
        shell: bash
        run: |
          set -euo pipefail
          # The denoiser is a default feature; a row without it says so explicitly.
          # `--no-default-features` is cargo's flag, not the Tauri CLI's -- it has to go
          # after `--`, or Tauri's own argument parser rejects it as unrecognised before
          # cargo ever sees it.
          cargo_args=()
          if [[ "${{ matrix.denoiser }}" != "true" ]]; then
            cargo_args=(-- --no-default-features)
          fi
          # --verbose so a bundler that fails prints its own error. Without it Tauri
          # reports only `failed to run light.exe` and the WiX diagnostic is lost.
          npx tauri build --verbose --bundles "${{ matrix.bundles }}" "${cargo_args[@]}"

      # Name every file the bundler produced, so a format that silently stops being
      # built is visible in the log rather than only in a release that lacks it.
      - name: What the bundler produced
        working-directory: studio/src-tauri/target/release/bundle
        shell: bash
        run: |
          set -euo pipefail
          # `find` rather than a `**` glob: the macOS runners run bash 3.2, which has no
          # globstar and fails the step on `shopt -s globstar`. And no `tee /dev/stderr`:
          # Git Bash on the Windows runner has no /dev/stderr to write to.
          files=$(find . \( \
            -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o \
            -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.app' \) -print)
          if [[ -z "${files}" ]]; then
            echo "::error::the bundler produced nothing for ${{ matrix.bundles }}"
            ls -R .
            exit 1
          fi
          printf '%s\n' "${files}"
          printf '%s\n' "${files}" | wc -l | tr -d ' ' | xargs -I{} echo "{} file(s)"

      # The installer's hooks replace an old "Inkvec Studio Lite" install. Running the
      # installer here would test the runner, not the hooks: this compiles them into a
      # harness and dry-runs it against a staged old install (.exe and .msi), in a private
      # registry key and folder, with the NSIS `tauri build` just downloaded.
      - name: Installer hooks, dry run
        if: runner.os == 'Windows'
        run: python studio/tools/check_installer_hooks.py

      # The backend's tests on this platform too. `check` runs them on Linux only, and
      # the code that differs by platform -- paths, the PATH and right-click integration,
      # the bundled command's name, ONNX Runtime linked in -- is exactly what Linux does
      # not exercise. After packaging, so the frontend bundle and the bundled `inkvec`
      # the build script checks for are already on disk. The tests use temporary paths
      # only, never the runner's preferences or model cache.
      - name: Backend tests on this platform
        if: runner.os != 'Linux'
        working-directory: studio/src-tauri
        run: cargo test --release
