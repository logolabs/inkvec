# Inkvec Studio's Tauri backend: the desktop shell round the shared core (studio/core).
#
# This is a workspace of its own, and the repository root excludes it, on purpose.
# `cargo build --workspace` at the root runs on every CI platform and must not need
# WebKitGTK, a WebView2 SDK or a macOS webview to succeed; pulling the app in as a
# member would make the engine's build depend on the app's system libraries. The app
# still depends on the engine by path, so it always builds against the tree it sits in.
#
# Its two siblings are members: the core both shells share, and the browser shell
# (Inkvec Studio Lite, built to WebAssembly by studio/scripts/build-web.mjs). One
# lock file then pins what the desktop app and its browser build are made of.
[workspace]
members = ["../core", "../wasm"]

[package]
name = "inkvec-studio"
description = "Inkvec Studio: turn a raster logo into an SVG, exactly, and minimise SVGs you already have."
version = "0.1.7"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["LogoLabs"]
repository = "https://github.com/logolabs/inkvec"
default-run = "inkvec-studio"

[lib]
# Tauri v2's mobile entry point wants the app as a library; the binary is a thin shim.
name = "inkvec_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "inkvec-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Everything the app does that is not about a window, a file or a thread, shared with the
# browser build.
inkvec-studio-core = { path = "../core" }
# The engine, by path, for what only the desktop does with it: `inkvec-cli` carries the
# native denoiser (the `denoiser` feature below), `inkvec-restore` names its weights and
# `inkvec-fab` answers the Fabricate tab.
inkvec-cli = { path = "../../crates/inkvec-cli" }
inkvec-fab = { path = "../../crates/inkvec-fab" }
inkvec-restore = { path = "../../crates/inkvec-restore" }

tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
# A second launch (the context menu's "Vectorize with Inkvec" while the app is open)
# hands its file to the running window instead of starting another copy.
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"

# Batch runs and the tests decode and write PNGs.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
    "bmp",
    "tiff",
] }

# The denoiser download: one HTTPS GET, checksummed on arrival. `ureq` is a blocking
# client with rustls and no async runtime, which is the whole of what this needs.
ureq = { version = "3", default-features = false, features = [
    "rustls",
    "gzip",
] }
sha2 = "0.10"
dirs = "6"

# Windows only, and only for the per-user context-menu entry: HKCU\Software\Classes.
# Nothing here writes a machine-wide hive or asks for elevation.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[features]
# The denoiser is part of the app, not an extra: "Clean up damage" and the Photo-or-scan
# preset are two of its headline controls and do nothing without it. So it is on by
# default, and the one target that cannot have it opts out with `--no-default-features`
# (x86_64-apple-darwin, where ONNX Runtime has no package).
default = ["denoiser"]
#: Compile the trained restorer in, so "Clean up damage" and the Photo-or-scan preset
#: can run. `ort` downloads a prebuilt ONNX Runtime at build time and links it
#: statically, which needs network on the first build; on Windows it also needs MSVC
#: 17.10 or newer (see studio/README.md, "Building on an older MSVC", for the dynamic
#: alternative).
denoiser = ["inkvec-cli/restore-model"]

[profile.release]
opt-level = 3
lto = true
# `panic = "abort"` is deliberately NOT set: the tracer is run inside catch_unwind so a
# panic deep in the pipeline becomes a "trace failed" state in the app rather than a
# window that vanishes.
codegen-units = 1
strip = true
