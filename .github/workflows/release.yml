name: release

# Tag pushes (v*) build every target/feature combination and publish a draft GitHub
# release. `workflow_dispatch` runs the same build matrix as a dry run: it exercises every
# target without creating or touching a release, since the publish job below is gated on
# the tag-push event specifically.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: inkvec

# Least-privilege by default; only the publish job elevates to contents: write.
permissions:
  contents: read

# Tag pushes should not cancel each other (a release build is not "superseded" the way a
# CI run on a branch is), so this only dedupes accidental double-triggers of the exact
# same ref.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.target }}, ${{ matrix.feature }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
        feature: [default, restore-model]
        exclude:
          # The ONNX Runtime package does not currently build for this legacy target;
          # retain the default Intel-macOS executable rather than blocking every archive.
          - target: x86_64-apple-darwin
            feature: restore-model
        include:
          # `glibc` is the oldest glibc the Linux executables have to run against; see the
          # build steps. 2.17 is manylinux2014's floor and Rust's own minimum. Absent on
          # every other row, where the ordinary cargo build applies.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            glibc: "2.17"
          # Native arm64 runner rather than `cross`/QEMU: the restore-model flavour needs
          # `ort` to download a matching prebuilt ONNX Runtime at build time, which is far
          # more likely to have an arm64 Linux asset than a cross-compiled sysroot is to
          # have every native dependency lined up. NOT verified locally (no arm64 runner
          # available here) -- verify the first tagged run.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            glibc: "2.17"
          # macos-15-intel is the supported Intel (x86_64) GitHub-hosted image;
          # macos-14 is arm64.
          # Pinned explicitly rather than macos-latest so the mapping doesn't silently
          # shift under us.
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.feature }}

      # `ubuntu-latest` is 24.04, so an ordinary build here leaves the executable asking
      # for GLIBC_2.39 and it will not start on Debian 11 or 12, Ubuntu 20.04 or 22.04, or
      # RHEL 8 or 9 -- it exits on the dynamic loader, before main. zigbuild pins the floor
      # instead, without a container.
      #
      # The restore-model flavour below is deliberately left alone: `ort` fetches a prebuilt
      # ONNX Runtime at build time and links it, so that archive's floor is whichever is
      # higher, ours or theirs, and putting zig's linker in the middle of it risks breaking
      # a build that currently works to fix a floor it may not even control. The plain CLI
      # is the artifact people actually download; this fixes that one and says so.
      - uses: mlugg/setup-zig@v2
        if: matrix.feature == 'default' && matrix.glibc != ''
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        if: matrix.feature == 'default' && matrix.glibc != ''
        with:
          tool: cargo-zigbuild

      - name: Build (default features, glibc ${{ matrix.glibc }})
        if: matrix.feature == 'default' && matrix.glibc != ''
        run: cargo zigbuild --release -p inkvec-cli --target ${{ matrix.target }}.${{ matrix.glibc }}

      - name: Build (default features)
        if: matrix.feature == 'default' && matrix.glibc == ''
        run: cargo build --release -p inkvec-cli --target ${{ matrix.target }}

      # Assert it, because the failure is silent until a user reports the binary will not
      # start, which is exactly how this was found.
      - name: No symbol newer than glibc ${{ matrix.glibc }}
        if: matrix.feature == 'default' && matrix.glibc != ''
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/${BIN_NAME}"
          max=$(objdump -T "$bin" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sort -uV | tail -1 || true)
          echo "highest required: ${max:-none}; floor: GLIBC_${{ matrix.glibc }}"
          if [ -n "$max" ] && [ "$(printf '%s\nGLIBC_%s\n' "$max" "${{ matrix.glibc }}" | sort -V | tail -1)" != "GLIBC_${{ matrix.glibc }}" ]; then
            echo "::error::$bin requires $max, above the GLIBC_${{ matrix.glibc }} floor"
            exit 1
          fi

      - name: Build (restore-model)
        # Windows + restore-model links ONNX Runtime statically, which needs MSVC 17.10+;
        # per the crate's own notes (crates/inkvec-restore/Cargo.toml) GitHub's
        # windows-latest image has that already. NOT independently re-verified in this
        # workflow beyond what those notes record -- watch the first tagged run's Windows
        # restore-model job.
        if: matrix.feature == 'restore-model'
        run: cargo build --release -p inkvec-cli --target ${{ matrix.target }} --features restore-model

      - name: Stage archive contents
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          FEATURE: ${{ matrix.feature }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_NAME:-}" != v* ]]; then
            version="0.0.0-dev"
          fi

          bin="${BIN_NAME}"
          ext=""
          if [[ "${TARGET}" == *windows* ]]; then
            ext=".exe"
          fi
          bin_path="target/${TARGET}/release/${bin}${ext}"

          name="inkvec-${version}-${TARGET}"
          if [[ "${FEATURE}" == "restore-model" ]]; then
            name="${name}-restore-model"
          fi

          stage="stage/${name}"
          mkdir -p "${stage}"
          cp "${bin_path}" "${stage}/"
          cp LICENSE NOTICE README.md "${stage}/"
          cp docs/THIRD_PARTY.md "${stage}/THIRD_PARTY.md"
          # The options, as the bindings see them: the ComfyUI node reads this file next
          # to the binary and builds its widgets from it, so a new option reaches it
          # without a node release.
          cp bindings/options.schema.json "${stage}/options.schema.json"

          if [[ "${FEATURE}" == "restore-model" ]]; then
            cat > "${stage}/RESTORER.txt" <<'EOF'
          This build includes the ONNX-Runtime-backed restorer (--restore), but NOT the
          trained restorer network itself: its licence is still under legal review, so it
          is not bundled in this archive or in the Inkvec repository.

          To use --restore:

            1. Download restorer.onnx from the Hugging Face model repository
               Logolabs/inkvec-denoiser-001 (https://huggingface.co/Logolabs/inkvec-denoiser-001).
            2. Place it next to this binary, or in a `models/` directory next to this
               binary, or point INKVEC_RESTORE_ONNX at its path.
            3. Run inkvec with --restore auto (or on).

          See the project README for the other restorer backends (restore-burn,
          restore-wgpu), which are not part of this pre-built archive.
          EOF

            # This build links ONNX Runtime statically (see crates/inkvec-restore/Cargo.toml),
            # so no onnxruntime library file should end up next to the binary and no
            # ThirdPartyNotices.txt copy should be needed. This step is defensive: if a
            # future change switches to dynamic linking, or `ort`'s download ever leaves a
            # shared library or notices file next to the build output, pick it up here
            # rather than silently omitting a required notice. NOT triggered in local
            # testing (this repository's working tree could not build restore-model at
            # all while this workflow was authored -- see PR description) -- verify on the
            # first tagged run that this either finds nothing (expected) or finds and
            # copies the right files.
            notice_src=$(find target -iname "ThirdPartyNotices.txt" -ipath "*onnxruntime*" 2>/dev/null | head -n1 || true)
            if [[ -n "${notice_src}" ]]; then
              cp "${notice_src}" "${stage}/ONNXRUNTIME_ThirdPartyNotices.txt"
            fi
            shopt -s nullglob
            for lib in "target/${TARGET}/release/"onnxruntime*.dll "target/${TARGET}/release/"libonnxruntime*.so* "target/${TARGET}/release/"libonnxruntime*.dylib; do
              cp "${lib}" "${stage}/"
            done
            shopt -u nullglob
          fi

          echo "ARCHIVE_NAME=${name}" >> "${GITHUB_ENV}"

      - name: Archive (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C stage -czf "dist/${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"

      - name: Archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "stage/$env:ARCHIVE_NAME" -DestinationPath "dist/$env:ARCHIVE_NAME.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: dist/*
          if-no-files-found: error


  # Inkvec Studio Lite, packaged for each platform. A separate job from the CLI matrix
  # above rather than another feature row in it: the app needs a Node toolchain and a
  # webview SDK, its bundles are installers rather than archives, and its build takes
  # long enough that folding it in would make every CLI archive wait for it.
  studio:
    name: studio (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 24.04, not 22.04, and that is about ONNX Runtime rather than about Ubuntu.
          # `ort` downloads a prebuilt ORT and links it statically; that prebuilt is
          # built against a newer libstdc++ than 22.04 links against, so on 22.04 the
          # link ends in undefined `__cxa_call_terminate` and
          # `basic_string::_M_replace_cold` out of `libort_sys`. The CLI's own
          # restore-model rows link the same prebuilt on 24.04 and have always
          # succeeded, which is the whole evidence for this line.
          #
          # The cost is the glibc floor: these bundles need what 24.04 has, so they
          # will not start on Ubuntu 22.04 or Debian 12. Taking the denoiser out
          # instead would buy that floor back -- the feature is optional and the app
          # reports it honestly when absent -- but it would also make Settings' "the
          # release builds for Windows, Linux and Apple-silicon macOS do" untrue.
          # If the older floor matters more, split Linux into two flavours the way the
          # CLI does rather than quietly dropping one of the two.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            bundles: deb,rpm,appimage
            denoiser: true
          # Native arm64 rather than cross: the app links a webview, and a
          # cross-compiled sysroot for WebKitGTK is not a fight worth having.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            bundles: deb,rpm,appimage
            denoiser: true
          # ONNX Runtime has no package for this target, which is why the CLI matrix
          # excludes its restore-model row too. The app says so honestly rather than
          # offering a download that could not be used.
          - target: x86_64-apple-darwin
            os: macos-15-intel
            bundles: app,dmg
            denoiser: false
          - target: aarch64-apple-darwin
            os: macos-14
            bundles: app,dmg
            denoiser: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bundles: nsis,msi
            denoiser: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio/src-tauri
          key: studio-${{ matrix.target }}

      # Ubuntu 22.04 rather than the newest image on purpose: an AppImage and a .deb
      # inherit the glibc and WebKitGTK of the machine that built them, and building on
      # 24.04 produces packages that will not start on 22.04.
      - name: Install the webview toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev librsvg2-dev patchelf file desktop-file-utils

      - run: npm ci
        working-directory: studio

      - name: Build and bundle
        working-directory: studio
        shell: bash
        # SIDECAR_TARGET tells `scripts/sidecar.mjs` which triple to build the bundled
        # `inkvec` command for; Tauri does not pass its own --target down to
        # beforeBuildCommand, and a host-built command in a cross bundle would not run.
        env:
          SIDECAR_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          features=""
          if [[ "${{ matrix.denoiser }}" == "true" ]]; then
            features="--features denoiser"
          fi
          npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} ${features}

      # Named the way the CLI archives are, so a release page reads as one set of
      # downloads rather than two conventions side by side.
      - name: Collect the installers
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_NAME:-}" != v* ]]; then
            version="0.0.0-dev"
          fi
          out="dist"
          mkdir -p "${out}"
          bundle="studio/src-tauri/target/${TARGET}/release/bundle"
          shopt -s nullglob globstar
          found=0
          for f in "${bundle}"/**/*.deb "${bundle}"/**/*.rpm "${bundle}"/**/*.AppImage \
                   "${bundle}"/**/*.dmg "${bundle}"/**/*.exe "${bundle}"/**/*.msi; do
            ext="${f##*.}"
            cp "${f}" "${out}/inkvec-studio-${version}-${TARGET}.${ext}"
            found=$((found + 1))
          done
          shopt -u globstar
          if [[ "${found}" -eq 0 ]]; then
            echo "::error::no bundles were produced for ${TARGET}"
            ls -R "${bundle}" || true
            exit 1
          fi
          # The .app is a directory; tar it so it survives upload and download.
          for app in "${bundle}"/macos/*.app; do
            tar -C "$(dirname "${app}")" -czf \
              "${out}/inkvec-studio-${version}-${TARGET}-app.tar.gz" "$(basename "${app}")"
          done
          ls -la "${out}"

      - uses: actions/upload-artifact@v4
        with:
          name: inkvec-studio-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  checksums:
    name: checksums
    needs: [build, studio]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect archives and hash them
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find artifacts -type f \( \
            -name "*.tar.gz" -o -name "*.zip" -o \
            -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o \
            -name "*.dmg" -o -name "*.exe" -o -name "*.msi" \
          \) -exec cp {} out/ \;
          (cd out && sha256sum -- * > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: out/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: checksums
    # workflow_dispatch runs are a dry run: build and checksum everything above, but never
    # reach this job, so nothing is published or touched on the releases page.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: out

      - name: Extract matching CHANGELOG section
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="${version}" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]") > 0) { found = 1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "No CHANGELOG.md section found for [${version}]; edit this release's notes before publishing." > notes.md
          fi

          # Every release carries the same verification section. Until the signing
          # certificate has been downloaded enough times Windows SmartScreen may warn on
          # the installer, and leaving somebody to guess what that means is worse than
          # saying it plainly next to the checksums that settle it.
          cat >> notes.md <<'NOTES'

          ---

          ## Verifying your download

          `SHA256SUMS` below covers every file in this release. To check one:

          - **Windows** — `certutil -hashfile <file> SHA256`
          - **macOS** — `shasum -a 256 <file>`
          - **Linux** — `sha256sum <file>`

          Inkvec Studio Lite for Windows is signed by LogoLabs SRL. Until that certificate
          has been downloaded enough times to build reputation, Windows may still show a
          blue SmartScreen warning: choose **More info**, then **Run anyway**. The
          checksum above is what actually settles whether the file is ours.

          Nothing in this release phones home. The app's only outbound requests are the
          update check, which sends its version and your operating system and can be
          turned off, and the optional denoiser download.
          NOTES
          # The heredoc above is indented for readability; strip that indent back out.
          sed -i 's/^          //' notes.md

      # The extraction script is validated against this repository's CHANGELOG heading
      # format (for example "## [0.1.1] - 2026-09-18"). A tag push publishes only after
      # every archive and its checksums are present.
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: notes.md
          fail_on_unmatched_files: true
          files: |
            out/*.tar.gz
            out/*.zip
            out/*.deb
            out/*.rpm
            out/*.AppImage
            out/*.dmg
            out/*.exe
            out/*.msi
            out/SHA256SUMS
