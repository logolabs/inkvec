[package]
name = "inkvec-trace"
description = "Raster tracing for the Inkvec vectoriser: palette, planar map, sub-pixel boundaries and gradient fills"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
inkvec-core = { workspace = true }
inkvec-fit = { workspace = true }
rayon = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
# ICC profiles to sRGB at intake (`load/icc.rs`). Already in the tree as the `image` crate's
# own colour engine, with the same features, so it adds no crate and no licence.
moxcms = "0.9"

[features]
default = []
#: Experimental stages kept for research, each still switched on at run time by its variable:
#: the five ink-grouping rules in `ink_ideas` (INKVEC_INK_IDEA), order-first decoding
#: (INKVEC_DECODE, module `decode`), saddle merging (INKVEC_SADDLE), lossy
#: re-labelling (INKVEC_LOSSY_REGULARIZE), RGB palette space (INKVEC_PALETTE_RGB), the
#: perceptual ink merge (INKVEC_MERGE_DE00) and the common-pixel band merge
#: (INKVEC_MERGE_COMMON_PIXELS). Off in every release build; the benchmark scripts that
#: study them need a binary built with `--features research`. See docs/internal/env-vars.md.
research = []

[lints]
workspace = true
