name: bindings

# The language-binding foundation: the `inkvec` facade crate, the C library (inkvec-ffi) and
# the Python package (inkvec-py). See docs/BINDINGS.md.
#
# Every job below builds and tests. The three publishing jobs at the end run ONLY on a `v*`
# tag AND only when the repository opts in (a variable or a secret, named in each job); on
# branches, pull requests and manual runs nothing is uploaded anywhere but this run's
# artifacts.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "crates/**"
      - "bindings/**"
      - "packages/dotnet/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/bindings.yml"
  pull_request:
    paths:
      - "crates/**"
      - "bindings/**"
      - "packages/dotnet/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/bindings.yml"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: bindings-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  facade:
    # The facade's unit tests, the schema drift check, the contract and the C ABI's own tests,
    # on all three OSes. A target with no recorded hashes in bindings/contract/cases.json is
    # checked on everything but the exact bytes; the cases.json blessed here with
    # INKVEC_BLESS=add is uploaded so its hashes can be committed.
    name: facade (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --locked -p inkvec -p inkvec-ffi
      - name: Record this target's contract hashes
        if: always()
        shell: bash
        run: INKVEC_BLESS=add cargo test --release --locked -p inkvec --test contract
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-${{ matrix.os }}
          path: bindings/contract/cases.json

  generated:
    # Everything generated from inkvec::Options must be committed up to date: the schema
    # (checked by `cargo test -p inkvec` above), the language stubs and tables, and the header.
    name: generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python bindings/codegen/generate.py --check
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen@0.29.4
      - run: >-
          cbindgen --config crates/inkvec-ffi/cbindgen.toml --crate inkvec-ffi
          --output crates/inkvec-ffi/include/inkvec.h --verify

  c-library:
    name: C library (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `glibc` is the oldest glibc the Linux libraries have to load against, and it is
          # what cargo-zigbuild is told to target below. 2.17 is manylinux2014's floor and
          # Rust's own minimum, so the archive runs on anything still getting updates.
          # Everywhere else the field is empty and the ordinary cargo build applies.
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc, glibc: "" }
          - { name: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, glibc: "2.17" }
          # Native arm64 runner, as in release.yml. NOT verified locally.
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, glibc: "2.17" }
          - { name: macos-arm64, os: macos-14, target: aarch64-apple-darwin, glibc: "" }
          - { name: macos-x64, os: macos-15-intel, target: x86_64-apple-darwin, glibc: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ffi-${{ matrix.target }}
      # The runner's own glibc is not the floor this should ship against. `ubuntu-latest` is
      # 24.04, so a plain build leaves the library asking for GLIBC_2.39, and it then fails
      # to load on Debian 11 and 12, Ubuntu 20.04 and 22.04, and RHEL 8 and 9. Every C ABI
      # consumer inherits that -- PHP, Go, Java, .NET and Swift alike -- while the wheels job
      # below is already portable through maturin's manylinux container. zigbuild is that
      # same idea without a container, which matters here: the steps after this one link the
      # C example and run the contract tests, and they keep doing so natively on the runner,
      # against the very library that gets archived.
      - uses: mlugg/setup-zig@v2
        if: matrix.glibc != ''
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        if: matrix.glibc != ''
        with:
          tool: cargo-zigbuild
      - name: Build against glibc ${{ matrix.glibc }}
        if: matrix.glibc != ''
        run: cargo zigbuild --release --locked -p inkvec-ffi --target ${{ matrix.target }}.${{ matrix.glibc }}
      - run: cargo build --release --locked -p inkvec-ffi --target ${{ matrix.target }}
        if: matrix.glibc == ''

      # Assert the property the archive is actually judged on, because a regression here is
      # silent: a dependency reaching for a newer symbol, or a runner image bump, shows up
      # only when someone reports that the library will not load.
      - name: No symbol newer than glibc ${{ matrix.glibc }}
        if: matrix.glibc != ''
        shell: bash
        run: |
          set -euo pipefail
          lib="target/${{ matrix.target }}/release/libinkvec_ffi.so"
          max=$(objdump -T "$lib" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sort -uV | tail -1 || true)
          echo "highest required: ${max:-none}; floor: GLIBC_${{ matrix.glibc }}"
          if [ -n "$max" ] && [ "$(printf '%s\nGLIBC_%s\n' "$max" "${{ matrix.glibc }}" | sort -V | tail -1)" != "GLIBC_${{ matrix.glibc }}" ]; then
            echo "::error::$lib requires $max, above the GLIBC_${{ matrix.glibc }} floor"
            exit 1
          fi

      - name: Build the C example (cc)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          lib="target/${{ matrix.target }}/release"
          cc -std=c99 -Wall -Wextra -pedantic -Werror -O2 crates/inkvec-ffi/examples/c/trace.c \
            -I crates/inkvec-ffi/include -L "$lib" -linkvec_ffi -Wl,-rpath,"$PWD/$lib" -o trace-c
          echo "INKVEC_C_EXAMPLE=$PWD/trace-c" >> "$GITHUB_ENV"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build the C example (MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $lib = "target/${{ matrix.target }}/release"
          cl /nologo /W4 /WX /O2 crates/inkvec-ffi/examples/c/trace.c /I crates/inkvec-ffi/include /Fe:trace-c.exe /link "$lib/inkvec_ffi.dll.lib"
          Copy-Item "$lib/inkvec_ffi.dll" .
          "INKVEC_C_EXAMPLE=$PWD\trace-c.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: The C ABI through ctypes, and the C example, against the contract
        shell: bash
        run: |
          pip install pytest
          case "${{ runner.os }}" in
            Windows) lib=inkvec_ffi.dll ;;
            macOS) lib=libinkvec_ffi.dylib ;;
            *) lib=libinkvec_ffi.so ;;
          esac
          INKVEC_LIB="$PWD/target/${{ matrix.target }}/release/$lib" python -m pytest -q crates/inkvec-ffi/tests

      - name: Stage the archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "${GITHUB_REF_NAME:-}" == v* ]] || version="0.0.0-dev"
          name="inkvec-c-${version}-${{ matrix.name }}"
          stage="stage/${name}"
          mkdir -p "${stage}/include" "${stage}/lib" "${stage}/examples"
          cp crates/inkvec-ffi/include/inkvec.h "${stage}/include/"
          lib="target/${{ matrix.target }}/release"
          # `shopt -s nullglob` stood here, but these are literal paths, not patterns, and
          # nullglob only ever drops a glob that matches nothing -- a word with no wildcard
          # is never subject to it. So every platform tried to copy all six names, five of
          # which it does not build, and `set -e` ended the job on the first. Test each name
          # instead, then insist that something was staged: an archive with an empty lib/ is
          # the one outcome this step must never produce quietly.
          staged=0
          for f in "$lib"/inkvec_ffi.dll "$lib"/inkvec_ffi.dll.lib "$lib"/inkvec_ffi.lib \
                   "$lib"/libinkvec_ffi.so "$lib"/libinkvec_ffi.dylib "$lib"/libinkvec_ffi.a; do
            if [ -e "$f" ]; then
              cp "$f" "${stage}/lib/"
              staged=$((staged + 1))
            fi
          done
          if [ "$staged" -eq 0 ]; then
            echo "::error::no library found in $lib to stage"
            exit 1
          fi
          cp crates/inkvec-ffi/examples/c/trace.c "${stage}/examples/"
          cp crates/inkvec-ffi/README.md "${stage}/README.md"
          cp LICENSE NOTICE "${stage}/"
          cp docs/THIRD_PARTY.md "${stage}/THIRD_PARTY.md"
          cp docs/BINDINGS.md "${stage}/BINDINGS.md"
          echo "ARCHIVE_NAME=${name}" >> "$GITHUB_ENV"
      - name: Archive (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: mkdir -p dist && tar -C stage -czf "dist/${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
      - name: Archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "stage/$env:ARCHIVE_NAME" -DestinationPath "dist/$env:ARCHIVE_NAME.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: c-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  wheels:
    # abi3 wheels (CPython 3.9+) built by maturin; Linux ones are manylinux, built in
    # maturin-action's container. Each is then installed on the runner and tested.
    name: wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: macos-arm64, os: macos-14, target: aarch64-apple-darwin }
          - { name: macos-x64, os: macos-15-intel, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist -m crates/inkvec-py/Cargo.toml
          manylinux: auto
          rust-toolchain: 1.98.0
      - name: Install and test the wheel
        shell: bash
        run: |
          pip install dist/*.whl pytest pillow numpy
          python -m pytest -q crates/inkvec-py/tests
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m crates/inkvec-py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  dotnet-test:
    # Builds and tests the NuGet package (packages/dotnet) against the native library
    # c-library just built for this OS: unpack its archive into
    # packages/dotnet/runtimes/<rid>/native/ (the same layout the packed nupkg carries; see
    # LogoLabs.Inkvec.csproj), then run the test suite once against each target framework
    # (net8.0 natively, netstandard2.0 by pointing the same net8.0 test host at the
    # library's netstandard2.0 build -- see LogoLabs.Inkvec.Tests.csproj).
    name: .NET (${{ matrix.name }})
    needs: c-library
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, rid: win-x64, native: inkvec_ffi.dll }
          - { name: linux-x64, os: ubuntu-latest, rid: linux-x64, native: libinkvec_ffi.so }
          - { name: macos-arm64, os: macos-14, rid: osx-arm64, native: libinkvec_ffi.dylib }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/download-artifact@v4
        with:
          name: c-${{ matrix.name }}
          path: dl
      - name: Unpack the native library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "packages/dotnet/runtimes/${{ matrix.rid }}/native"
          archive=$(find dl -type f \( -name '*.tar.gz' -o -name '*.zip' \))
          case "$archive" in
            *.tar.gz) tar -xzf "$archive" -C dl ;;
            *.zip) unzip -q "$archive" -d dl ;;
          esac
          find dl -name "${{ matrix.native }}" -exec cp {} "packages/dotnet/runtimes/${{ matrix.rid }}/native/" \;
      - run: dotnet test packages/dotnet/test/LogoLabs.Inkvec.Tests -c Release
      - name: Test the netstandard2.0 build (through the net8.0 host)
        run: dotnet test packages/dotnet/test/LogoLabs.Inkvec.Tests -c Release -p:InkvecLibraryTargetFramework=netstandard2.0

  dotnet-pack:
    # One nupkg carrying every native library c-library built (win-arm64 is not in that
    # matrix yet, so it is not in the package either -- see LogoLabs.Inkvec.csproj, which
    # skips whichever RIDs are absent rather than failing).
    name: .NET pack
    needs: [c-library, dotnet-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/download-artifact@v4
        with:
          pattern: c-*
          path: dl
      - name: Unpack every native library into runtimes/<rid>/native/
        shell: bash
        run: |
          set -euo pipefail
          declare -A rid_of=( [windows-x64]=win-x64 [linux-x64]=linux-x64 [linux-arm64]=linux-arm64 [macos-arm64]=osx-arm64 [macos-x64]=osx-x64 )
          for dir in dl/c-*; do
            plat=$(basename "$dir" | sed 's/^c-//')
            rid=${rid_of[$plat]:-}
            [[ -n "$rid" ]] || { echo "unknown platform $plat"; exit 1; }
            mkdir -p "packages/dotnet/runtimes/$rid/native"
            archive=$(find "$dir" -type f \( -name '*.tar.gz' -o -name '*.zip' \))
            case "$archive" in
              *.tar.gz) tar -xzf "$archive" -C "$dir" ;;
              *.zip) unzip -q "$archive" -d "$dir" ;;
            esac
            find "$dir" \( -name 'inkvec_ffi.dll' -o -name 'libinkvec_ffi.so' -o -name 'libinkvec_ffi.dylib' \) \
              -exec cp {} "packages/dotnet/runtimes/$rid/native/" \;
          done
          find packages/dotnet/runtimes -type f
      - run: dotnet pack packages/dotnet/src/LogoLabs.Inkvec -c Release -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-nupkg
          path: |
            dist/*.nupkg
            dist/*.snupkg
          if-no-files-found: error

  # ------------------------------------------------------------------------------------
  # Publishing. Each job runs only on a v* tag AND only when the repository has opted in.
  # ------------------------------------------------------------------------------------

  publish-pypi:
    # Opt in: set the repository variable PUBLISH_PYPI to `true` and register this repository
    # and workflow (environment `pypi`) as a trusted publisher of the `inkvec` project on
    # PyPI. No token is stored. To use an API token instead, add
    # `password: ${{ secrets.PYPI_API_TOKEN }}` to the publish step.
    name: publish to PyPI
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-nuget:
    # Opt in: set the repository variable PUBLISH_NUGET to `true` and add a NuGet.org API
    # key as the secret NUGET_API_KEY.
    name: publish to NuGet
    needs: dotnet-pack
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_NUGET == 'true'
    runs-on: ubuntu-latest
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dotnet-nupkg
          path: dist
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish
        if: env.NUGET_API_KEY != ''
        run: dotnet nuget push "dist/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish-crates:
    # Opt in: set the repository variable PUBLISH_CRATES to `true` and add a crates.io API
    # token as the secret CARGO_REGISTRY_TOKEN. `cargo publish --workspace` publishes every
    # member that is not `publish = false`, in dependency order: inkvec-core, inkvec-fit,
    # inkvec-trace, inkvec-sr, inkvec-restore, inkvec-cli, inkvec. The version is the
    # workspace version; a version already on crates.io fails the job.
    name: publish to crates.io
    needs: [facade, generated]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_CRATES == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Publish
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --workspace --locked

  release-c:
    # Attaches the C library archives to the GitHub release of the tag (release.yml creates
    # it). Needs nothing but this workflow's own token.
    name: attach C libraries to the release
    needs: c-library
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: c-*
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum -- * > SHA256SUMS-c
      # `draft: true` on purpose: the release stays a draft until a maintainer publishes
      # it (see release.yml). Leaving it out makes the action publish the draft it finds.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            out/*.tar.gz
            out/*.zip
            out/SHA256SUMS-c
