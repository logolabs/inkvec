[workspace]
resolver = "2"
members = [
    "crates/inkvec-core",
    "crates/inkvec-fit",
    "crates/inkvec-trace",
    "crates/inkvec-cli",
    "crates/inkvec-wasm",
    "crates/inkvec-sr",
    "crates/inkvec-restore",
    "crates/inkvec",
    "crates/inkvec-ffi",
    "crates/inkvec-py",
    "crates/inkvec-server",
    "crates/inkvec-svgmin",
]
# Inkvec Studio Lite is a workspace of its own. `cargo build --workspace` runs on every CI
# platform and must not start needing WebKitGTK, a WebView2 SDK or a macOS webview; the app
# still depends on these crates by path, so it always builds against the tree it sits in.
exclude = ["studio/src-tauri"]

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"
authors = ["LogoLabs"]
repository = "https://github.com/logolabs/inkvec"
readme = "README.md"
keywords = ["svg", "vectorization", "vectorizer", "image-tracing", "raster-to-vector"]
categories = ["graphics", "multimedia::images"]

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
too_many_lines = "warn"

[workspace.dependencies]
# Internal crates carry a version as well as a path: crates.io refuses a published crate
# whose dependency is a bare path.
inkvec-core = { path = "crates/inkvec-core", version = "0.1.5" }
inkvec-fit = { path = "crates/inkvec-fit", version = "0.1.5" }
inkvec-trace = { path = "crates/inkvec-trace", version = "0.1.5" }
inkvec-sr = { path = "crates/inkvec-sr", version = "0.1.5" }
inkvec-restore = { path = "crates/inkvec-restore", version = "0.1.5" }
inkvec-svgmin = { path = "crates/inkvec-svgmin", version = "0.1.5" }
inkvec-cli = { path = "crates/inkvec-cli", version = "0.1.5" }
inkvec = { path = "crates/inkvec", version = "0.1.5" }
robust = "1.1"
rayon = "1.10"
kurbo = "0.13"
# The options contract every language binding is generated from (crates/inkvec).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
