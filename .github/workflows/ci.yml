name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Least-privilege by default; jobs that need more (there are none in this workflow)
# would declare it themselves.
permissions:
  contents: read

# Cancel a superseded run on the same branch/PR so pushes in quick succession don't
# queue redundant work.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - run: cargo test --release --workspace

  gate:
    # The 246-icon screen set under Quality and Fast at 128 px, 512 px and 512 px flattened
    # onto white, each condition's dE00, turning and parameter ratio judged against the
    # per-icon baseline for this platform (bench/gate/baselines/linux-x86_64.json) by a
    # paired bootstrap non-inferiority rule; see bench/ci_gate.py. Until that file is
    # committed the gate runs the 09-19 rule against bench/gate/baseline.json. Either way
    # the run is uploaded as `gate-baseline`, ready to commit as the Linux baseline.
    #
    # Before it, the hard-case suite (bench/cases.py) holds the set of passing cases in
    # Quality and in Fast to the sets recorded in bench/quality_budget.json (`cases:*`).
    name: regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p inkvec-cli
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy pillow scikit-image resvg_py svgelements
      - name: gate's own tests
        run: >-
          python -m unittest bench/tests/test_gate_stats.py bench/tests/test_ci_gate.py
          bench/tests/test_gate_scoring.py bench/tests/test_gt_diff.py bench/tests/test_design.py
          bench/tests/test_cases_ratchet.py
      - name: hard cases, Quality
        run: python bench/cases.py --exe target/release/inkvec --ratchet quality
      - name: hard cases, Fast
        if: ${{ !cancelled() }}
        run: python bench/cases.py --exe target/release/inkvec --ratchet fast -- --mode fast
      - name: regression gate
        if: ${{ !cancelled() }}
        run: >-
          python bench/ci_gate.py --exe target/release/inkvec --workers 4
          --report-json gate/report.json --artifact-dir gate
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: gate-baseline
          path: gate/

  svgmin-gate:
    # The minifier's own gate, which is shaped differently on purpose: its job is to spend
    # fidelity for description length, so savings and dE00 are gated against each other
    # rather than each ratcheted downwards. See the docstring in bench/svgmin_gate.py.
    name: minifier gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p inkvec-svgmin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pillow scikit-image resvg_py svgelements
      - run: python bench/svgmin_gate.py --exe target/release/inkvec-svgmin

  quality:
    # The code-quality ratchet: bench/quality_budget.json records what is true today and
    # this fails on a move away from it. Existing debt is grandfathered by name, so this
    # never blocks work on an old long function -- only on a new one. It also holds each
    # crate's line coverage (cargo llvm-cov) to a floor and unused dependencies (cargo
    # machete) at zero.
    name: quality ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-machete
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s bench/tests -p test_quality.py
      - run: python bench/quality.py --coverage

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    # Only clippy::correctness and clippy::suspicious fail the job. Plain warnings
    # (including the 39 grandfathered clippy::too_many_lines hits the quality ratchet
    # tracks separately in bench/quality_budget.json) must not fail CI here.
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D clippy::correctness -D clippy::suspicious

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  msrv:
    # Pinned to the exact rust-version in the workspace Cargo.toml. If that version is
    # bumped, bump the toolchain input here in the same PR.
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  wasm:
    name: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p inkvec-wasm --target wasm32-unknown-unknown

  restore-model:
    # Confirms the optional ONNX-Runtime-backed restorer feature still compiles. `ort`
    # downloads a prebuilt ONNX Runtime at build time; this needs outbound network
    # access, which GitHub-hosted runners have by default.
    name: restore-model build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p inkvec-cli --features restore-model

  versions:
    # One version, in Cargo.toml; the npm package, the POM, the OpenAPI document, both
    # wasm-pack packages, Inkvec Studio and both lockfiles each hold a copy. This fails when
    # any copy disagrees, which is how the 0.1.6 tag shipped a 0.1.5 npm package.json and
    # POM. The fix is named in tools/check_versions.py's docstring.
    name: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/check_versions.py

  licences:
    # docs/THIRD_PARTY.md is generated from `cargo tree`; this fails if it drifts from
    # the actual dependency graph (see tools/third_party.py).
    name: licences
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/third_party.py --check
