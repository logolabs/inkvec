name: docker

# Builds the inkvec-server image (services/docker/Dockerfile) with buildx for linux/amd64 and
# linux/arm64, runs the shared contract (bindings/contract/cases.json) over HTTP against the
# freshly built linux/amd64 image (services/docker/contract_check.py), and, only on a `v*`
# tag, pushes the multi-arch manifest to ghcr.io/logolabs/inkvec. On branches, pull requests
# and manual runs nothing is pushed anywhere.
#
# NOT exercised outside GitHub Actions: this repository's local environment has no running
# Docker engine, so this workflow is unverified beyond `docker build`/`docker run` on a
# developer machine with Docker Desktop up (see crates/inkvec-server/README.md).

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "crates/inkvec-server/**"
      - "crates/inkvec/**"
      - "services/docker/**"
      - "bindings/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "crates/inkvec-server/**"
      - "crates/inkvec/**"
      - "services/docker/**"
      - "bindings/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/logolabs/inkvec

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-and-test:
    name: build (linux/amd64) and run the HTTP contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (load locally, single arch, for testing)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: inkvec-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the container
        run: |
          docker run -d --name inkvec-server -p 8080:8080 inkvec-server:test
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/healthz && break
            sleep 1
          done
          curl -sf http://localhost:8080/healthz
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: The shared contract, over HTTP
        run: python services/docker/contract_check.py --base-url http://localhost:8080 --target x86_64-linux-gnu
      - name: Container logs (always, for debugging)
        if: always()
        run: docker logs inkvec-server
      - name: Stop the container
        if: always()
        run: docker rm -f inkvec-server

  build-multiarch-and-push:
    # Builds linux/amd64 AND linux/arm64 (no --load: a multi-platform build cannot be loaded
    # into the local daemon, only pushed or written as an OCI layout) and pushes the manifest
    # list, only on a version tag. GITHUB_TOKEN needs packages: write, granted only to this
    # job. build-and-test above already proved the amd64 image healthy and contract-correct;
    # this job trusts the same Dockerfile and build context to produce the same result on
    # arm64 under QEMU emulation (buildx's default for a non-native platform on this runner).
    name: build multi-arch and push
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: services/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            INKVEC_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
