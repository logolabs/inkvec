name: release

# Tag pushes (v*) build every target/feature combination and publish a draft GitHub
# release. `workflow_dispatch` runs the same build matrix as a dry run: it exercises every
# target without creating or touching a release, since the publish job below is gated on
# the tag-push event specifically.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: inkvec

# Least-privilege by default; only the publish job elevates to contents: write.
permissions:
  contents: read

# Tag pushes should not cancel each other (a release build is not "superseded" the way a
# CI run on a branch is), so this only dedupes accidental double-triggers of the exact
# same ref.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.target }}, ${{ matrix.feature }})
    runs-on: ${{ matrix.os }}
    # One target failing must not take the rest of the release down with it: `checksums`
    # needs every row of this job, and by default a job with any failed matrix leg reports
    # overall failure, which would skip `checksums` (and so `publish`) even though the
    # other archives built fine and are sitting in artifacts ready to ship. `fail-fast:
    # false` above already lets every row run to completion regardless of its neighbours;
    # this is what stops one row's failure from being contagious to the jobs after it.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # Every row is written out rather than crossed, because the floor each archive
        # can run on differs per row and belongs next to the row it describes:
        #
        #   glibc / glibcxx  the oldest glibc and libstdc++ the Linux executable may ask
        #                    for. Asserted after the build by `.github/scripts/abi_floor.py`,
        #                    which reads the binary rather than trusting the build.
        #   macos            the oldest macOS the executable may ask for, asserted the
        #                    same way from its Mach-O load commands.
        #
        # A floor is not a wish: it is either what the toolchain was told to target
        # (the zigbuild rows) or what the build image actually has (every other row), so
        # a check that fails means the image or a dependency moved, not that the number
        # is optimistic.
        include:
          # The plain command line, which is the archive people actually download.
          # Ubuntu 24.04's own glibc is 2.39, so an ordinary build here leaves the
          # executable asking for GLIBC_2.39 and it will not start on Debian 11 or 12,
          # Ubuntu 20.04 or 22.04, or RHEL 8 or 9 -- it exits on the dynamic loader,
          # before main. zigbuild pins the floor at 2.17 instead, without a container:
          # manylinux2014's floor, and Rust's own minimum.
          - target: x86_64-unknown-linux-gnu
            feature: default
            os: ubuntu-24.04
            glibc: "2.17"
          # Native arm64 runner rather than `cross`/QEMU: the restore-model flavour needs
          # `ort` to download a matching prebuilt ONNX Runtime at build time, which is far
          # more likely to have an arm64 Linux asset than a cross-compiled sysroot is to
          # have every native dependency lined up.
          - target: aarch64-unknown-linux-gnu
            feature: default
            os: ubuntu-24.04-arm
            glibc: "2.17"
          # The restorer flavour cannot have that floor, and says so rather than
          # pretending: `ort` downloads a prebuilt ONNX Runtime and links it statically,
          # and that prebuilt calls glibc 2.38's `__isoc23_strtol` family and GCC 13's
          # `basic_string::_M_replace_cold`. Measured on the 0.1.5 archives, not assumed.
          # So this archive needs glibc 2.38 and libstdc++ 13 -- Ubuntu 23.10, Debian 13,
          # Fedora 39 or newer -- while the plain archive above runs on glibc 2.17.
          # RESTORER.txt in the archive says so too. Putting zig's linker in the middle of
          # a C++ static link that currently works would risk breaking it to fix a floor
          # it does not control.
          - target: x86_64-unknown-linux-gnu
            feature: restore-model
            os: ubuntu-24.04
            glibc: "2.38"
            glibcxx: "3.4.31"
          - target: aarch64-unknown-linux-gnu
            feature: restore-model
            os: ubuntu-24.04-arm
            glibc: "2.38"
            glibcxx: "3.4.31"
          # macos-15-intel is the supported Intel (x86_64) GitHub-hosted image;
          # macos-14 is arm64. Pinned explicitly rather than macos-latest so the mapping
          # doesn't silently shift under us.
          #
          # MACOSX_DEPLOYMENT_TARGET is set from `macos` below rather than left to
          # rustc's default, which has been raised twice and will be again: 10.12 is
          # what the 0.1.5 Intel archive happened to get, and this keeps it. 11.0 on
          # Apple silicon is the oldest macOS that architecture exists on.
          - target: x86_64-apple-darwin
            feature: default
            os: macos-15-intel
            macos: "10.12"
          - target: aarch64-apple-darwin
            feature: default
            os: macos-14
            macos: "11.0"
          # The ONNX Runtime package has no build for Intel macOS; the Intel archive is
          # the plain one above rather than nothing at all.
          - target: aarch64-apple-darwin
            feature: restore-model
            os: macos-14
            macos: "11.0"
          - target: x86_64-pc-windows-msvc
            feature: default
            os: windows-latest
          - target: x86_64-pc-windows-msvc
            feature: restore-model
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.feature }}

      # zigbuild, on the plain-CLI Linux rows only: it is what pins the glibc floor at
      # 2.17 without a container. The restore-model rows are deliberately left to the
      # ordinary linker -- see the note on their matrix rows.
      - uses: mlugg/setup-zig@v2
        if: matrix.feature == 'default' && matrix.glibc != ''
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        if: matrix.feature == 'default' && matrix.glibc != ''
        with:
          tool: cargo-zigbuild

      - name: Build (default features, glibc ${{ matrix.glibc }})
        if: matrix.feature == 'default' && matrix.glibc != ''
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos }}
        run: cargo zigbuild --release -p inkvec-cli --target ${{ matrix.target }}.${{ matrix.glibc }}

      - name: Build (default features)
        if: matrix.feature == 'default' && matrix.glibc == ''
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos }}
        run: cargo build --release -p inkvec-cli --target ${{ matrix.target }}

      - name: Build (restore-model)
        # Windows + restore-model links ONNX Runtime statically, which needs MSVC 17.10+;
        # per the crate's own notes (crates/inkvec-restore/Cargo.toml) GitHub's
        # windows-latest image has that already. Confirmed by the 0.1.5 tag run, whose
        # Windows restore-model job built and archived.
        if: matrix.feature == 'restore-model'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos }}
        run: cargo build --release -p inkvec-cli --target ${{ matrix.target }} --features restore-model

      # Assert the floor, because the failure is silent until a user reports the binary
      # will not start, which is exactly how this was found. The script reads the built
      # executable: versioned imports on Linux (weak ones reported but not counted, since
      # the loader is content to leave them null), the Mach-O minimum OS on macOS.
      - name: The oldest system this build will start on
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/${BIN_NAME}"
          args=()
          if [ -n "${{ matrix.glibc }}" ]; then args+=(--glibc "${{ matrix.glibc }}"); fi
          if [ -n "${{ matrix.glibcxx }}" ]; then args+=(--glibcxx "${{ matrix.glibcxx }}"); fi
          if [ -n "${{ matrix.macos }}" ]; then args+=(--macos "${{ matrix.macos }}"); fi
          python3 .github/scripts/abi_floor.py "$bin" "${args[@]}"

      - name: Stage archive contents
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          FEATURE: ${{ matrix.feature }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_NAME:-}" != v* ]]; then
            version="0.0.0-dev"
          fi

          bin="${BIN_NAME}"
          ext=""
          if [[ "${TARGET}" == *windows* ]]; then
            ext=".exe"
          fi
          bin_path="target/${TARGET}/release/${bin}${ext}"

          name="inkvec-${version}-${TARGET}"
          if [[ "${FEATURE}" == "restore-model" ]]; then
            name="${name}-restore-model"
          fi

          stage="stage/${name}"
          mkdir -p "${stage}"
          cp "${bin_path}" "${stage}/"
          cp LICENSE NOTICE README.md "${stage}/"
          cp docs/THIRD_PARTY.md "${stage}/THIRD_PARTY.md"
          # The options, as the bindings see them: the ComfyUI node reads this file next
          # to the binary and builds its widgets from it, so a new option reaches it
          # without a node release.
          cp bindings/options.schema.json "${stage}/options.schema.json"

          if [[ "${FEATURE}" == "restore-model" ]]; then
            cat > "${stage}/RESTORER.txt" <<'EOF'
          This build includes the ONNX-Runtime-backed restorer (--restore), but NOT the
          trained restorer network itself: its licence is still under legal review, so it
          is not bundled in this archive or in the Inkvec repository.

          To use --restore:

            1. Download restorer.onnx from the Hugging Face model repository
               Logolabs/inkvec-denoiser-001 (https://huggingface.co/Logolabs/inkvec-denoiser-001).
            2. Place it next to this binary, or in a `models/` directory next to this
               binary, or point INKVEC_RESTORE_ONNX at its path.
            3. Run inkvec with --restore auto (or on).

          See the project README for the other restorer backends (restore-burn,
          restore-wgpu), which are not part of this pre-built archive.
          EOF

            # The floor this flavour runs on, stated in the archive rather than only in
            # the workflow: ONNX Runtime's prebuilt is what sets it, and somebody holding
            # a file that will not start deserves to be told why by the file itself.
            if [[ "${TARGET}" == *linux* ]]; then
              cat >> "${stage}/RESTORER.txt" <<'EOF'

          Which systems this build runs on
          --------------------------------

          The statically linked ONNX Runtime in this archive needs glibc 2.38 or newer
          and the libstdc++ from GCC 13 or newer: Ubuntu 23.10, Debian 13, Fedora 39,
          RHEL 10 or later. On anything older it stops in the dynamic loader before it
          starts.

          The plain inkvec archive for this platform is built against glibc 2.17 and
          runs on all of those and on much older systems, without --restore.
          EOF
            fi

            # This build links ONNX Runtime statically (see crates/inkvec-restore/Cargo.toml),
            # so no onnxruntime library file should end up next to the binary and no
            # ThirdPartyNotices.txt copy should be needed. This step is defensive: if a
            # future change switches to dynamic linking, or `ort`'s download ever leaves a
            # shared library or notices file next to the build output, pick it up here
            # rather than silently omitting a required notice. NOT triggered in local
            # testing (this repository's working tree could not build restore-model at
            # all while this workflow was authored -- see PR description) -- verify on the
            # first tagged run that this either finds nothing (expected) or finds and
            # copies the right files.
            notice_src=$(find target -iname "ThirdPartyNotices.txt" -ipath "*onnxruntime*" 2>/dev/null | head -n1 || true)
            if [[ -n "${notice_src}" ]]; then
              cp "${notice_src}" "${stage}/ONNXRUNTIME_ThirdPartyNotices.txt"
            fi
            shopt -s nullglob
            for lib in "target/${TARGET}/release/"onnxruntime*.dll "target/${TARGET}/release/"libonnxruntime*.so* "target/${TARGET}/release/"libonnxruntime*.dylib; do
              cp "${lib}" "${stage}/"
            done
            shopt -u nullglob
          fi

          echo "ARCHIVE_NAME=${name}" >> "${GITHUB_ENV}"

      - name: Archive (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C stage -czf "dist/${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"

      - name: Archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "stage/$env:ARCHIVE_NAME" -DestinationPath "dist/$env:ARCHIVE_NAME.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: dist/*
          if-no-files-found: error


  # Inkvec Studio, packaged for each platform. A separate job from the CLI matrix
  # above rather than another feature row in it: the app needs a Node toolchain and a
  # webview SDK, its bundles are installers rather than archives, and its build takes
  # long enough that folding it in would make every CLI archive wait for it.
  studio:
    name: studio (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # See the identical note on `build`: one platform's bundle failing must not withhold
    # every other platform's, or the CLI's, from the release.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # An app bundle inherits the glibc, libstdc++ and WebKitGTK of the machine that
        # built it, so the image is the floor. `glibc`/`glibcxx`/`macos` record the one
        # each row is expected to have and are asserted against the binary that actually
        # comes out, by the same script the CLI archives use.
        include:
          # 24.04, not 22.04, and that is about ONNX Runtime rather than about Ubuntu.
          # `ort` downloads a prebuilt ONNX Runtime and links it statically, and that
          # prebuilt needs glibc 2.38 and GCC 13's libstdc++: on 22.04 the link ends in
          # undefined `__isoc23_strtoll` and `basic_string::_M_replace_cold` out of
          # `libort_sys`, which is exactly how the 0.1.5 tag run failed on both Linux
          # rows. The CLI's own restore-model rows link the same prebuilt on 24.04 and
          # have always succeeded.
          #
          # The cost is the floor: one bundle per architecture, with the denoiser in it,
          # means these bundles need what 24.04 has and will not start on Ubuntu 22.04,
          # Debian 12 or RHEL 9. That is deliberate -- the app ships the feature rather
          # than shipping without it -- and the README says which glibc each download
          # needs so nobody has to find out from a loader error. Linux users on an older
          # distribution have the `inkvec` command itself, whose plain archive is built
          # against glibc 2.17 and runs on all of them.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            bundles: deb,rpm,appimage
            denoiser: true
            glibc: "2.39"
            glibcxx: "3.4.33"
          # Native arm64 rather than cross: the app links a webview, and a
          # cross-compiled sysroot for WebKitGTK is not a fight worth having.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            bundles: deb,rpm,appimage
            denoiser: true
            glibc: "2.39"
            glibcxx: "3.4.33"
          # ONNX Runtime has no package for this target, which is why the CLI matrix has
          # no restore-model row for it either. The app says so honestly rather than
          # offering a download that could not be used.
          - target: x86_64-apple-darwin
            os: macos-15-intel
            bundles: app,dmg
            denoiser: false
            macos: "10.15"
          - target: aarch64-apple-darwin
            os: macos-14
            bundles: app,dmg
            denoiser: true
            macos: "11.0"
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bundles: nsis,msi
            denoiser: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio/src-tauri
          key: studio-${{ matrix.target }}

      # WebKitGTK 4.1 and its friends, from whichever Ubuntu this row builds on: the
      # bundle takes that image's versions with it, which is what the floors above record.
      - name: Install the webview toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev librsvg2-dev patchelf file desktop-file-utils xdg-utils

      # linuxdeploy's AppImage plugin downloads the type2 runtime in the middle of
      # bundling, and a 504 from that download failed a Linux row once already. A tag run
      # that dies there costs a re-tag, so fetch it up front with retries and hand the
      # plugin the file through LDAI_RUNTIME_FILE.
      - name: Fetch the AppImage runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          runtime="${RUNNER_TEMP}/appimage-runtime-$(uname -m)"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
            -o "${runtime}" \
            "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-$(uname -m)"
          chmod +x "${runtime}"
          echo "LDAI_RUNTIME_FILE=${runtime}" >> "${GITHUB_ENV}"

      - run: npm ci
        working-directory: studio

      - name: Build and bundle
        working-directory: studio
        shell: bash
        # SIDECAR_TARGET tells `scripts/sidecar.mjs` which triple to build the bundled
        # `inkvec` command for; Tauri does not pass its own --target down to
        # beforeBuildCommand, and a host-built command in a cross bundle would not run.
        #
        # MACOSX_DEPLOYMENT_TARGET matches `bundle.macOS.minimumSystemVersion` in
        # tauri.conf.json; on Apple silicon it is 11.0, the oldest macOS that
        # architecture exists on, rather than a number clang would only clamp anyway.
        env:
          SIDECAR_TARGET: ${{ matrix.target }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos }}
        run: |
          set -euo pipefail
          # The denoiser is a default feature of the app, so the only row that says
          # anything is the one that cannot have it. `--no-default-features` is cargo's
          # flag, not the Tauri CLI's -- it has to go after `--`, or Tauri's own argument
          # parser rejects it as unrecognised before cargo ever sees it.
          cargo_args=()
          if [[ "${{ matrix.denoiser }}" != "true" ]]; then
            cargo_args=(-- --no-default-features)
          fi
          npx tauri build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" "${cargo_args[@]}"

      # The app and the `inkvec` command it carries, both checked: an installer that
      # cannot start is as useless as an archive that cannot, and the bundled command is
      # what Settings puts on PATH.
      - name: The oldest system this build will start on
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ -n "${{ matrix.glibc }}" ]; then args+=(--glibc "${{ matrix.glibc }}"); fi
          if [ -n "${{ matrix.glibcxx }}" ]; then args+=(--glibcxx "${{ matrix.glibcxx }}"); fi
          if [ -n "${{ matrix.macos }}" ]; then args+=(--macos "${{ matrix.macos }}"); fi
          python3 .github/scripts/abi_floor.py \
            "studio/src-tauri/target/${{ matrix.target }}/release/inkvec-studio" "${args[@]}"
          python3 .github/scripts/abi_floor.py \
            "target/${{ matrix.target }}/release/${BIN_NAME}" "${args[@]}"

      # Named the way the CLI archives are, so a release page reads as one set of
      # downloads rather than two conventions side by side.
      - name: Collect the installers
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_NAME:-}" != v* ]]; then
            version="0.0.0-dev"
          fi
          out="dist"
          mkdir -p "${out}"
          bundle="studio/src-tauri/target/${TARGET}/release/bundle"
          shopt -s nullglob
          # `find`, not a `**` glob: the macOS runners' bash is 3.2, where `shopt -s
          # globstar` is not an option at all -- it fails the step outright, which is how
          # this was found.
          found=0
          while IFS= read -r f; do
            ext="${f##*.}"
            cp "${f}" "${out}/inkvec-studio-${version}-${TARGET}.${ext}"
            found=$((found + 1))
          done < <(find "${bundle}" -type f \( \
            -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o \
            -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) | sort)
          if [[ "${found}" -eq 0 ]]; then
            echo "::error::no bundles were produced for ${TARGET}"
            ls -R "${bundle}" || true
            exit 1
          fi
          # The .app is a directory; tar it so it survives upload and download.
          for app in "${bundle}"/macos/*.app; do
            tar -C "$(dirname "${app}")" -czf \
              "${out}/inkvec-studio-${version}-${TARGET}-app.tar.gz" "$(basename "${app}")"
          done
          ls -la "${out}"

      - uses: actions/upload-artifact@v4
        with:
          name: inkvec-studio-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  checksums:
    name: checksums
    needs: [build, studio]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect archives and hash them
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find artifacts -type f \( \
            -name "*.tar.gz" -o -name "*.zip" -o \
            -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o \
            -name "*.dmg" -o -name "*.exe" -o -name "*.msi" \
          \) -exec cp {} out/ \;
          (cd out && sha256sum -- * > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: out/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: checksums
    # workflow_dispatch runs are a dry run: build and checksum everything above, but never
    # reach this job, so nothing is published or touched on the releases page.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: out

      - name: Extract matching CHANGELOG section
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="${version}" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]") > 0) { found = 1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "No CHANGELOG.md section found for [${version}]; edit this release's notes before publishing." > notes.md
          fi

          # Every release carries the same two sections. Nothing here is code-signed --
          # no certificate is configured on any platform -- so both operating systems put
          # a warning in front of the app, and leaving somebody to guess what that means
          # is worse than saying it plainly next to the checksums that settle it.
          cat >> notes.md <<'NOTES'

          ---

          ## Which download

          | File | What it is | Oldest system it starts on |
          | --- | --- | --- |
          | `inkvec-*-<target>.tar.gz` / `.zip` | The command line | Linux glibc 2.17 · macOS 10.12 Intel, 11.0 Apple silicon · Windows 10 |
          | `inkvec-*-<target>-restore-model.*` | The command line with the `--restore` restorer compiled in | Linux glibc 2.38 and libstdc++ 13 · macOS 11.0, Apple silicon only · Windows 10 |
          | `inkvec-studio-*` | Inkvec Studio, the desktop app | Linux glibc 2.38, libstdc++ 13 and WebKitGTK 4.1 (Ubuntu 23.10, Debian 13, Fedora 39+) · macOS 10.15 Intel, 11.0 Apple silicon · Windows 10 |

          The restorer links a prebuilt ONNX Runtime that calls glibc 2.38 and GCC 13
          symbols, and the app ships the restorer: that is where the two higher floors come
          from. On an older Linux, take the plain command-line archive, which is built
          against glibc 2.17. Every floor above is asserted during the build by reading the
          binary that came out of it.

          ---

          ## Verifying your download

          `SHA256SUMS` below covers every file in this release. To check one:

          - **Windows** — `certutil -hashfile <file> SHA256`
          - **macOS** — `shasum -a 256 <file>`
          - **Linux** — `sha256sum <file>`

          ---

          ## Opening the app the first time

          These builds are **not code-signed** on any platform, so each operating system
          will say so in its own way. The checksum above is what actually settles whether
          a file is ours.

          - **Windows** — SmartScreen shows "Windows protected your PC" with an unknown
            publisher: choose **More info**, then **Run anyway**.
          - **macOS** — Gatekeeper refuses an unsigned, un-notarised app downloaded from a
            browser. Open Applications, Control-click **Inkvec Studio**, choose
            **Open**, then **Open** again in the dialog. If macOS still refuses, run
            `xattr -dr com.apple.quarantine "/Applications/Inkvec Studio.app"`.
          - **Linux** — nothing special for the `.deb` or `.rpm`; an `.AppImage` needs
            `chmod +x` before it will run.

          Nothing in this release phones home. The app's only outbound requests are the
          update check, which sends its version and your operating system and can be
          turned off, and the optional denoiser download.
          NOTES
          # The heredoc above is indented for readability; strip that indent back out.
          sed -i 's/^          //' notes.md

      # The extraction script is validated against this repository's CHANGELOG heading
      # format (for example "## [0.1.1] - 2026-09-18"). A tag push publishes whatever
      # `build` and `studio` managed to produce between them, not only every archive.
      #
      # `fail_on_unmatched_files` is off on purpose: `build` and `studio` each carry on
      # past a failing platform now (see the `continue-on-error` note on both), so one
      # platform's archives can be genuinely absent here -- Windows down would zero out
      # `*.msi`/`*.exe`, both macOS rows down would zero out `*.dmg` -- and that is a
      # smaller release, not a broken workflow. Every archive that *is* present still gets
      # its own checksum, and the platform table below still names what should exist; a
      # human reads the run to notice what a glob match count no longer enforces.
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: notes.md
          fail_on_unmatched_files: false
          files: |
            out/*.tar.gz
            out/*.zip
            out/*.deb
            out/*.rpm
            out/*.AppImage
            out/*.dmg
            out/*.exe
            out/*.msi
            out/SHA256SUMS
