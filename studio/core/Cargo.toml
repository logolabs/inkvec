# The Studio's platform-independent half: everything the app does between "an image is
# open" and "here is the drawing, measured", with no window, no file system and no threads
# of its own. Both shells are thin wrappers round it:
#
#   studio/src-tauri   Inkvec Studio, the desktop app (threads, files, events)
#   studio/wasm        Inkvec Studio Lite, the same app in a browser tab (a Web Worker)
#
# so a feature added here lands in both. It is a member of the desktop app's workspace
# rather than the engine's, for the reason studio/src-tauri gives: the engine's workspace
# is built on every CI platform and must not grow the app's dependencies.
[package]
name = "inkvec-studio-core"
description = "Inkvec Studio's shared core: tracing, measuring, palettes, export and fabrication, for the desktop app and its browser build."
version = "0.1.6"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["LogoLabs"]
repository = "https://github.com/logolabs/inkvec"
publish = false
workspace = "../src-tauri"

[dependencies]
inkvec-cli = { path = "../../crates/inkvec-cli" }
inkvec-core = { path = "../../crates/inkvec-core" }
inkvec-trace = { path = "../../crates/inkvec-trace" }
inkvec-fab = { path = "../../crates/inkvec-fab" }
inkvec-fit = { path = "../../crates/inkvec-fit" }
inkvec-restore = { path = "../../crates/inkvec-restore" }
inkvec-sr = { path = "../../crates/inkvec-sr" }
inkvec-svgmin = { path = "../../crates/inkvec-svgmin" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"

# Rasterising the traced SVG is what makes the quality report a measurement rather than an
# adjective: the colour difference is computed between the source pixels and a render of
# the SVG just written, not estimated from the fit.
resvg = { version = "0.48", default-features = false }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
    "bmp",
    "tiff",
] }
zip = { version = "8", default-features = false, features = ["deflate"] }
