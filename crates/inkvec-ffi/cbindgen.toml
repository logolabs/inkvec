# cbindgen configuration for include/inkvec.h.
#
# Regenerate (from the repository root):
#   cbindgen --config crates/inkvec-ffi/cbindgen.toml --crate inkvec-ffi --output crates/inkvec-ffi/include/inkvec.h
# Check without writing (CI):
#   cbindgen --config crates/inkvec-ffi/cbindgen.toml --crate inkvec-ffi --output crates/inkvec-ffi/include/inkvec.h --verify

language = "C"
cpp_compat = true
include_guard = "INKVEC_H"
no_includes = true
sys_includes = ["stddef.h", "stdint.h", "string.h"]
usize_is_size_t = true
style = "both"
documentation = true
documentation_style = "c"

header = """
/*
 * inkvec.h -- the C API of Inkvec, raster logos, icons and illustrations to SVG.
 * https://github.com/logolabs/inkvec  SPDX-License-Identifier: Apache-2.0
 *
 * GENERATED by cbindgen from crates/inkvec-ffi/src/lib.rs. Do not edit by hand.
 *
 * Usage:
 *
 *   InkvecResult r = INKVEC_RESULT_INIT;
 *   int status = inkvec_trace(png_bytes, png_len, "{\\"colors\\": 16}", &r);
 *   if (status == INKVEC_OK) fwrite(r.svg, 1, r.svg_len, out);
 *   else fprintf(stderr, "%s\\n", r.error);
 *   inkvec_result_free(&r);
 *
 * Options are one JSON object (NULL or "" for the defaults). Their names, types, defaults,
 * descriptions and ranges are the JSON Schema returned by inkvec_options_schema(); adding an
 * option to Inkvec never changes this header.
 *
 * Strings in an InkvecResult belong to the library: release them with inkvec_result_free().
 * Strings returned by inkvec_version(), inkvec_build_target(), inkvec_options_schema() and
 * inkvec_default_options() are static and must not be freed. Every function is thread-safe.
 */"""

trailer = """
/*
 * Header-only helper, not a library export: an InkvecResult ready for a call, every field
 * zero and struct_size set to the size this header gives the struct, so a newer library
 * never writes past it.
 *
 *   InkvecResult r = INKVEC_RESULT_INIT;     or     InkvecResult r = inkvec_result_init();
 *
 * Guarded separately because cbindgen places it after the include guard.
 */
#ifndef INKVEC_RESULT_INIT
static inline InkvecResult inkvec_result_init(void) {
  InkvecResult r;
  memset(&r, 0, sizeof r);
  r.struct_size = (uint32_t)sizeof r;
  return r;
}
#define INKVEC_RESULT_INIT inkvec_result_init()
#endif"""

[export]
include = ["InkvecResult"]

[parse]
parse_deps = false
