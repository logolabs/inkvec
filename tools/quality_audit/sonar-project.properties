# SonarQube project settings for Inkvec. Run from the repository root, after
# `python tools/quality_audit/run.py` has written target-sonar/ (see sonarqube.md):
#
#   sonar-scanner -Dproject.settings=tools/quality_audit/sonar-project.properties
#
# Every path below is relative to the repository root (sonar.projectBaseDir).

sonar.projectKey=inkvec
sonar.projectName=Inkvec
sonar.projectVersion=0.2.0
sonar.sourceEncoding=UTF-8
sonar.projectBaseDir=.

# ---------------------------------------------------------------- what is analysed
# The engine workspace, the Studio's Rust core and shells, and the Studio's TypeScript UI.
# Integration tests, examples and benches are indexed as tests, so issues imported on them
# (clippy, jscpd) still land, but they do not count as production code.
sonar.sources=crates,studio/core/src,studio/src-tauri/src,studio/wasm/src,studio/src
sonar.tests=crates
sonar.test.inclusions=crates/*/tests/**,crates/*/examples/**,crates/*/benches/**
sonar.exclusions=**/target/**,**/node_modules/**,**/pkg/**,**/pkg-threads/**,crates/*/tests/**,crates/*/examples/**,crates/*/benches/**,**/*.d.ts

# ---------------------------------------------------------------- Rust analyzer
# The analyzer runs `cargo clippy` itself by default, which needs cargo inside the scanner
# container. The audit runs clippy (with pedantic + nursery) on the host and imports it as
# generic issues instead (target-sonar/clippy.generic.json), which also sidesteps the
# workspace path bug in the analyzer's own Clippy import (Sonar ticket RUST-115).
sonar.rust.clippy.enabled=false
sonar.rust.cargo.manifestPaths=Cargo.toml
# The Clippy report property is documented as sonar.rust.clippy.reportPaths, but the
# analyzer reads sonar.rust.clippyReport.reportPaths (Sonar Community thread 178187). Both
# are left unset on purpose: clippy arrives through the generic import below.
#sonar.rust.clippy.reportPaths=target-sonar/clippy_native.json
#sonar.rust.clippyReport.reportPaths=target-sonar/clippy_native.json

# Coverage from cargo-llvm-cov. lcov.docker.info has /usr/src/<repo path> source paths,
# matching the scanner container in sonarqube.md; use target-sonar/lcov.info (repo-relative
# paths) for a scanner running directly on the host.
sonar.rust.lcov.reportPaths=target-sonar/lcov.docker.info

# ---------------------------------------------------------------- external findings
# Generic issue format (SonarQube 10.3+: rules with cleanCodeAttribute + impacts), one
# file per tool; tools/quality_audit/sonar_export.py writes and validates them.
sonar.externalIssuesReportPaths=target-sonar/clippy.generic.json,target-sonar/complexity.generic.json,target-sonar/mutants.generic.json,target-sonar/machete.generic.json,target-sonar/deny.generic.json,target-sonar/jscpd.generic.json

# SARIF 2.1.0: CodeQL's Rust security + quality suites and Semgrep (p/rust + the Inkvec
# rules in tools/quality_audit/semgrep/). An empty SARIF is written when a tool was not run.
sonar.sarifReportPaths=target-sonar/codeql.sarif,target-sonar/semgrep.sarif
