[package]
name = "inkvec-wasm"
description = "Inkvec in the browser: the tracer compiled to WebAssembly"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
# Built into the web demo with wasm-pack; not a crate anyone depends on.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-opt runs after wasm-bindgen and validates against the features it is told about,
# not the ones the binary uses. Shared memory, atomics and SIMD all have to be named
# here or it rejects the threaded module. `simd128` is on for both builds -- via
# `.cargo/config.toml` for the single-threaded one and restated in the threaded arm's
# RUSTFLAGS in `tools/build_wasm.sh` -- so it belongs here for both.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O3', '--enable-threads', '--enable-bulk-memory', '--enable-mutable-globals', '--enable-simd']

[features]
# Real threads in the browser. Needs a nightly toolchain and a rebuilt `std` (the atomics
# target feature is not in the shipped one), and a cross-origin isolated page, so it is a
# feature rather than the default -- `tools/build_wasm.sh` builds both.
threads = ["dep:wasm-bindgen-rayon", "dep:rayon"]

[dependencies]
inkvec = { workspace = true }
inkvec-cli = { workspace = true }
# `structure`, for the page's editability readout.
inkvec-svgmin = { workspace = true }
inkvec-trace = { workspace = true }
# The denoiser's arithmetic and its `auto` decision, without an ML runtime: default features
# only, so the network itself stays out of the module. The page runs it in ONNX Runtime Web.
inkvec-restore = { workspace = true }
# For `inkvec_sr::Mode`, which `inkvec_cli::Args::lossy` is.
inkvec-sr = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
wasm-bindgen-rayon = { version = "1.2", optional = true }
rayon = { workspace = true, optional = true }

