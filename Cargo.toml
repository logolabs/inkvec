[workspace]
resolver = "2"
members = [
    "crates/inkvec-core",
    "crates/inkvec-fit",
    "crates/inkvec-trace",
    "crates/inkvec-cli",
    "crates/inkvec-wasm",
    "crates/inkvec-sr",
    "crates/inkvec-restore",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"
authors = ["LogoLabs"]
repository = "https://github.com/logolabs/inkvec"
readme = "README.md"
keywords = ["svg", "vectorization", "vectorizer", "image-tracing", "raster-to-vector"]
categories = ["graphics", "multimedia::images"]

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
too_many_lines = "warn"

[workspace.dependencies]
# Internal crates carry a version as well as a path: crates.io refuses a published crate
# whose dependency is a bare path.
inkvec-core = { path = "crates/inkvec-core", version = "0.1.3" }
inkvec-fit = { path = "crates/inkvec-fit", version = "0.1.3" }
inkvec-trace = { path = "crates/inkvec-trace", version = "0.1.3" }
inkvec-sr = { path = "crates/inkvec-sr", version = "0.1.3" }
inkvec-restore = { path = "crates/inkvec-restore", version = "0.1.3" }
inkvec-cli = { path = "crates/inkvec-cli", version = "0.1.3" }
robust = "1.1"
rayon = "1.10"
kurbo = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
