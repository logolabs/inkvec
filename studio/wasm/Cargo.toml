# Inkvec Studio Lite: the Studio's shared core (studio/core) compiled to WebAssembly, for
# the interface to drive from a Web Worker with the same commands and events the desktop
# app's Tauri backend answers. Built by studio/scripts/build-web.mjs, twice, like the
# engine's own browser package (tools/build_wasm.sh):
#
#   pkg/          stable toolchain, one core, runs anywhere
#   pkg-threads/  nightly, std rebuilt with atomics, a rayon pool of Web Workers; needs a
#                 cross-origin isolated page
[package]
name = "inkvec-studio-wasm"
description = "Inkvec Studio Lite: the Studio's core in the browser, as WebAssembly."
version = "0.1.7"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["LogoLabs"]
repository = "https://github.com/logolabs/inkvec"
publish = false
workspace = "../src-tauri"

[lib]
crate-type = ["cdylib", "rlib"]

# See crates/inkvec-wasm: wasm-opt validates against the features it is told about.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O3', '--enable-threads', '--enable-bulk-memory', '--enable-mutable-globals', '--enable-simd', '--enable-nontrapping-float-to-int', '--enable-sign-ext']

[features]
# Real threads: wasm-bindgen-rayon's pool. Needs nightly and build-std; see build-web.mjs.
threads = ["dep:wasm-bindgen-rayon"]

[dependencies]
inkvec-studio-core = { path = "../core" }
# The engine pieces the browser shell reaches directly: the denoiser's tensor preparation
# and constants (`inkvec-restore`), the pipeline's intake / trace split the denoiser sits
# between (`inkvec-cli`), and the Fabricate tab (`inkvec-fab`).
inkvec-cli = { path = "../../crates/inkvec-cli" }
inkvec-restore = { path = "../../crates/inkvec-restore" }
inkvec-fab = { path = "../../crates/inkvec-fab" }
inkvec-trace = { path = "../../crates/inkvec-trace" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
wasm-bindgen-rayon = { version = "1.2", optional = true }
