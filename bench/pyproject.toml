[project]
name = "inkvec-bench"
version = "0.1.0"
description = "Evaluation harness for raster-to-vector engines: fidelity, structure, and editability."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pillow>=10.0",
    "scikit-image>=0.21",
    "shapely>=2.0",
    "svgpathtools>=1.6",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "requests>=2.31",
    "tqdm>=4.65",
    "resvg-py>=0.1",
]

[project.optional-dependencies]
# Perceptual metrics. Heavy (torch); everything else works without them.
perceptual = ["torch>=2.0", "torchvision>=0.15", "lpips>=0.1.4", "DISTS-pytorch>=0.1"]
# Baseline tracers.
baselines = ["vtracer>=0.6", "potracer>=0.0.4"]

[project.scripts]
inkvec-bench = "inkvec_bench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["inkvec_bench*"]
