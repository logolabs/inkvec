version: 2

updates:
  # Rust workspace dependencies (Cargo.toml files under crates/ share the root manifest).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 10

  # GitHub Actions used in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # `dtolnay/rust-toolchain@1.98.0` is not an action version: the tag names the Rust
      # toolchain the job installs (the workspace's, kept in step with the MSRV job's own
      # pin). A bump to `@1.120.0` asks for a toolchain that does not exist and fails every
      # job; the toolchain moves by hand, with the code that needs it.
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      github-actions:
        patterns:
          - "*"

  # Python benchmark harness (bench/pyproject.toml).
  - package-ecosystem: "pip"
    directory: "/bench"
    schedule:
      interval: "weekly"
    groups:
      bench-python-dependencies:
        patterns:
          - "*"
