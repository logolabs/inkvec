name: Feature request
description: Suggest something Inkvec should do that it doesn't today.
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Inkvec is deliberately narrow in scope (see "Who this
        is not for" in the README) — it's worth checking your idea fits that scope before
        filing.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do, and how does Inkvec fall short today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: A new flag, a change in default behavior, a new output option, etc.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, flags, or workarounds you've tried.

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Example input/output, links to similar features in other tools, etc.
