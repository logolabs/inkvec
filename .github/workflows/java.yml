name: java

# Builds the Java package (packages/java: JNA over inkvec-ffi's C ABI) using the per-platform
# native libraries the "bindings" workflow already builds (job c-library), rather than
# rebuilding them here: it runs after that workflow finishes on main or a v* tag, downloads
# its c-* artifacts, and unpacks each platform's shared library into the jar under JNA's
# resource prefix (win32-x86-64/, linux-x86-64/, linux-aarch64/, darwin-x86-64/,
# darwin-aarch64/), so the assembled jar needs no native build step for a consumer.
#
# Tested on linux, windows and macos against that assembled jar (no jna.library.path
# override: this is the same jar a consumer would get). On a v* tag, publishes to Maven
# Central through the Central Publisher Portal when the secrets below are configured;
# without them the publish job records a notice and the jar stays attached to the run.
#
# NOT verified by running this workflow -- no CI has executed it. Locally verified instead:
# `cargo build --release -p inkvec-ffi` + `mvn test` on Windows x64 with JDK 22, and a
# `--release 8` compile, per packages/java/README.md.

on:
  workflow_run:
    workflows: [bindings]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: >-
          Run id of the "bindings" workflow to pull the C libraries from. Defaults to the
          triggering run when this is itself triggered by that workflow finishing.
        required: false

permissions:
  contents: read

concurrency:
  group: java-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  assemble:
    name: assemble the jar
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: generated files are current (InkvecOptions.java, the README table, pom.xml's version)
        run: |
          python bindings/codegen/generate.py --check
          python packages/java/build.py --check
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: download the C libraries the bindings workflow built
        uses: actions/download-artifact@v8
        with:
          pattern: c-*
          path: c-libs
          run-id: ${{ github.event.workflow_run.id || inputs.run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: unpack each platform's shared library into its JNA resource prefix
        shell: bash
        run: |
          set -euo pipefail
          unpack() { # unpack <c-library artifact dir name> <jna resource prefix>
            local archive work
            archive=$(find "c-libs/$1" -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | head -1)
            [ -n "$archive" ] || { echo "no archive found for $1"; return 1; }
            work=$(mktemp -d)
            case "$archive" in
              *.tar.gz) tar -xzf "$archive" -C "$work" ;;
              *.zip) unzip -q "$archive" -d "$work" ;;
            esac
            local staged dest
            staged=$(find "$work" -maxdepth 1 -mindepth 1 -type d | head -1)
            dest="packages/java/src/main/resources/$2"
            mkdir -p "$dest"
            cp "$staged"/lib/inkvec_ffi.dll "$dest"/ 2>/dev/null || true
            cp "$staged"/lib/libinkvec_ffi.so "$dest"/ 2>/dev/null || true
            cp "$staged"/lib/libinkvec_ffi.dylib "$dest"/ 2>/dev/null || true
            rm -rf "$work"
          }
          unpack c-windows-x64 win32-x86-64
          unpack c-linux-x64 linux-x86-64
          unpack c-linux-arm64 linux-aarch64
          unpack c-macos-arm64 darwin-aarch64
          unpack c-macos-x64 darwin-x86-64
          find packages/java/src/main/resources -type f
      - run: mvn -q -f packages/java/pom.xml -DskipTests package
      - uses: actions/upload-artifact@v7
        with:
          name: java-package
          path: packages/java/target/*.jar
          if-no-files-found: error

  test:
    name: test (${{ matrix.os }})
    needs: assemble
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v8
        with:
          name: java-package
          path: packages/java/target
      - name: test against the assembled jar's bundled native library
        working-directory: packages/java
        shell: bash
        # No jna.library.path override: this exercises exactly what a consumer gets, JNA's
        # own extraction of the per-platform resource the assemble job just bundled.
        run: mvn -q test -Djna.library.path=

  publish:
    name: publish to Maven Central
    needs: [assemble, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      HAVE_SECRETS: ${{ secrets.MAVEN_CENTRAL_USERNAME != '' && secrets.MAVEN_CENTRAL_PASSWORD != '' && secrets.MAVEN_GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: java-package
          path: packages/java/target
      # Opt in: set the repository variable PUBLISH_MAVEN to `true`, register a verified
      # Maven Central namespace (see packages/java/README.md -- com.logolabs is a
      # placeholder), and configure four secrets: MAVEN_CENTRAL_USERNAME and
      # MAVEN_CENTRAL_PASSWORD (a Central Publisher Portal user token), and
      # MAVEN_GPG_PRIVATE_KEY and MAVEN_GPG_PASSPHRASE (an ASCII-armored signing key, for
      # the artifacts Central requires be signed).
      - uses: actions/setup-java@v6
        if: env.HAVE_SECRETS == 'true' && vars.PUBLISH_MAVEN == 'true'
        with:
          distribution: temurin
          java-version: "17"
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: tag matches Cargo.toml's version
        if: env.HAVE_SECRETS == 'true' && vars.PUBLISH_MAVEN == 'true'
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          test "$want" = "$have" || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $have"; exit 1; }
      - name: mvn deploy (signed, to the Central Publisher Portal)
        if: env.HAVE_SECRETS == 'true' && vars.PUBLISH_MAVEN == 'true'
        working-directory: packages/java
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -q -Prelease deploy -DskipTests
      - name: not published
        if: env.HAVE_SECRETS != 'true' || vars.PUBLISH_MAVEN != 'true'
        run: echo "::notice::PUBLISH_MAVEN is not 'true', or one of MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD / MAVEN_GPG_PRIVATE_KEY / MAVEN_GPG_PASSPHRASE is not set; the jar was built and tested but not published."
