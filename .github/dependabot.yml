version: 2

updates:
  # Rust workspace dependencies (Cargo.toml files under crates/ share the root manifest).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 10

  # GitHub Actions used in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Python benchmark harness (bench/pyproject.toml).
  - package-ecosystem: "pip"
    directory: "/bench"
    schedule:
      interval: "weekly"
    groups:
      bench-python-dependencies:
        patterns:
          - "*"
